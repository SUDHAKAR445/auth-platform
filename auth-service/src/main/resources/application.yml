spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_platform
    username: postgres
    password: yourrootpw
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  # dev-only secret — move to an environment variable / secrets manager before any real deployment.
  # HS256 requires at least 32 bytes; this is well over that.
  secret: development-only-secret-please-move-to-env-var-before-prod-1234567890
  expiration: 900 # access token, seconds (15 minutes)
  refresh-expiration: 604800 # refresh token, seconds (7 days)
